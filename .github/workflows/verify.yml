name: verify

# 这个工作流的存在理由：所有"已验证"的数字此前都只在作者本机跑过。
# 交给 GitHub 的机器跑，日志公开、任何人可重放，才算有第二个执行主体。

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewer
        uses: actions/checkout@v4

      - name: Checkout redteam suite
        uses: actions/checkout@v4
        with:
          repository: zhaoxinghua09-cell/skill-redteam-suite
          # 必须检出到被测目录之外。放进仓库内部，探针包会被算进"本包文件"，
          # 层级与杂物检查随即扣分——自评从 100 掉到 92 就是这么来的。
          path: ../suite

      - name: Python version
        run: python3 --version

      - name: Golden self-tests
        run: python3 tests/run_golden.py || true

      - name: Redteam probes
        run: python3 "$GITHUB_WORKSPACE/../suite/run_suite.py" --reviewer "$GITHUB_WORKSPACE/scripts/review.py" || true

      - name: Self review (full dimensions, informational)
        run: python3 scripts/review.py . --eight || true

      - name: Diagnose structure
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import review as rv
          fm = rv.frontmatter(open('SKILL.md', encoding='utf-8').read())
          print("FM KEYS:", sorted(fm.keys()))
          print("VERSION:", repr(fm.get("version")))
          res = rv.review('.', do_run=False)
          print("DIMS:",
                {k: (v["score"], v["max"]) for k, v in res["data"]["dimensions"].items()})
          files = rv.walk(rv.os.path.abspath('.'))
          print("GOT_NOTES:", rv.d_structure(rv.os.path.abspath('.'), fm, files))
          deep = [f for f in files
                  if len(rv.os.path.relpath(f, rv.os.path.abspath('.')).split(rv.os.sep)) > 3]
          print("DEEP:", deep[:6])
          print("STRAY:", [f for f in files if f.endswith(('.pyc', '.zip')) or '__pycache__' in f][:6])
          for a in res["data"]["actions"][:8]:
              print("ACT:", a.get("id"), a.get("issue"))
          PY

      - name: Assert the three published numbers
        run: |
          python3 tests/run_golden.py | tail -1
          python3 "$GITHUB_WORKSPACE/../suite/run_suite.py" --reviewer "$GITHUB_WORKSPACE/scripts/review.py" | tail -1
          python3 scripts/review.py . --eight > /tmp/self.txt || true
          grep -E "总分：" /tmp/self.txt
